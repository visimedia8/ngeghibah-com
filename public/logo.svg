<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Container -->
    <linearGradient id="logoIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="logoNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="60%" stop-color="#E11D74" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Monogram Mark Group (Left) -->
  <g transform="translate(16, 16)">
    <!-- Squircle Background -->
    <rect width="128" height="128" rx="36" fill="url(#logoIconBg)" stroke="#23304E" stroke-width="2" />
    <rect width="124" height="124" x="2" y="2" rx="34" fill="none" stroke="url(#logoNeonGrad)" stroke-width="2" opacity="0.5" />

    <!-- Scaled Paparazzi Lens G Path -->
    <g transform="translate(18, 18) scale(0.18)" filter="url(#logoGlow)">
      <path
        d="M365 185
           C335 125 260 115 195 140
           C125 170 95 245 110 320
           C125 395 195 440 275 430
           C345 420 395 375 405 305
           L265 305
           C252 305 245 295 245 282
           L245 258
           C245 245 252 238 265 238
           L435 238
           C448 238 458 248 458 262
           C458 355 385 465 260 465
           C145 465 55 385 45 265
           C35 145 135 50 255 50
           C325 50 390 85 425 140
           C432 152 428 168 415 175
           L382 192
           C374 196 368 192 365 185 Z"
        fill="url(#logoNeonGrad)"
      />
      <circle cx="410" cy="115" r="24" fill="url(#logoCyanGrad)" />
      <circle cx="256" cy="256" r="20" fill="#00F0FF" />
    </g>
  </g>

  <!-- Typography Brand Group (Right) -->
  <g transform="translate(164, 40)">
    <!-- Wordmark "NgeGhibah.com" -->
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-1.5">
      <tspan fill="#FFFFFF" x="0" y="52">Nge</tspan>
      <tspan fill="#FF2E93" filter="url(#logoGlow)">Ghibah</tspan>
      <tspan fill="#00F0FF" font-size="44" font-weight="800">.com</tspan>
    </text>

    <!-- Subtitle Tagline Badge -->
    <g transform="translate(4, 76)">
      <!-- Radar Dot -->
      <circle cx="6" cy="10" r="4" fill="#FF2E93" />
      <circle cx="6" cy="10" r="8" fill="none" stroke="#FF2E93" stroke-width="1.5" opacity="0.6" />
      <text x="24" y="14" font-family="'Inter', monospace, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="3.5">
        KRONOLOGI &amp; VERIFIKASI FAKTA
      </text>
    </g>
  </g>
</svg>
