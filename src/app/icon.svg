<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Neon Brand Gradient (Pink to Cyan) -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#D91678" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Cyan Verification Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#70F8FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Border Glow -->
    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.4" />

  <!-- Radar Arc Ambient Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FF2E93" stroke-width="2" opacity="0.15" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.1" />

  <!-- Central Paparazzi Aperture / Glowing 'G' Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Main Sweeping 'G' Outer Spine -->
    <path
      d="M365 185
         C335 125 260 115 195 140
         C125 170 95 245 110 320
         C125 395 195 440 275 430
         C345 420 395 375 405 305
         L265 305
         C252 305 245 295 245 282
         L245 258
         C245 245 252 238 265 238
         L435 238
         C448 238 458 248 458 262
         C458 355 385 465 260 465
         C145 465 55 385 45 265
         C35 145 135 50 255 50
         C325 50 390 85 425 140
         C432 152 428 168 415 175
         L382 192
         C374 196 368 192 365 185 Z"
      fill="url(#neonGrad)"
    />

    <!-- Verification Flash Dot (Upper Right Radar Ping) -->
    <circle cx="410" cy="115" r="22" fill="url(#cyanGrad)" filter="url(#borderGlow)" />
    <!-- Center Lens Core Accent -->
    <circle cx="256" cy="256" r="18" fill="#00F0FF" opacity="0.9" />
  </g>
</svg>
